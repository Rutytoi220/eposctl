[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eposctl"
version = "0.1.0"
description = "Open-source Linux userspace driver, CLI, Waybar telemetry provider, TUI, and PipeWire DSP manager for the EPOS H3PRO Hybrid"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
hidapi = [
    "hid>=1.0.5",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
eposctl = "eposctl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eposctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
