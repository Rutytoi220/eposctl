# PipeWire filter-chain EQ profile: FLAT (Reference Neutral)
# Target: EPOS H3PRO Hybrid (alsa_output.usb-1395_EPOS_H3PRO_0123456789ABCDEF-00.iec958-stereo)
#
# Install to ~/.config/pipewire/pipewire.conf.d/ or launch directly with:
#   pipewire -c pipewire/epos-eq-flat.conf

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "EPOS H3PRO EQ (Flat)"
            media.name       = "EPOS H3PRO EQ (Flat)"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 60.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 250.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 4000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_highshelf
                        control = { "Freq" = 10000.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name      = "epos_h3pro_eq_flat"
                media.class    = Audio/Sink
                audio.rate     = 48000
            }
            playback.props = {
                node.name      = "epos_h3pro_eq_flat_out"
                node.passive   = true
                audio.rate     = 48000
                target.object  = "alsa_output.usb-1395_EPOS_H3PRO_0123456789ABCDEF-00.iec958-stereo"
            }
        }
    }
]
