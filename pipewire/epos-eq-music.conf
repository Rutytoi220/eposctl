# PipeWire filter-chain EQ profile: MUSIC (Balanced Warmth & Detail)
# Gentle low-end warmth and airy upper-treble sparkle without harshness.
# Target: EPOS H3PRO Hybrid (alsa_output.usb-1395_EPOS_H3PRO_0123456789ABCDEF-00.iec958-stereo)

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "EPOS H3PRO EQ (Music)"
            media.name       = "EPOS H3PRO EQ (Music)"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 65.0 "Q" = 0.707 "Gain" = 2.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 160.0 "Q" = 1.0 "Gain" = 1.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = -0.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 4000.0 "Q" = 1.1 "Gain" = 1.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_highshelf
                        control = { "Freq" = 10000.0 "Q" = 0.707 "Gain" = 2.5 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name      = "epos_h3pro_eq_music"
                media.class    = Audio/Sink
                audio.rate     = 48000
            }
            playback.props = {
                node.name      = "epos_h3pro_eq_music_out"
                node.passive   = true
                audio.rate     = 48000
                target.object  = "alsa_output.usb-1395_EPOS_H3PRO_0123456789ABCDEF-00.iec958-stereo"
            }
        }
    }
]
