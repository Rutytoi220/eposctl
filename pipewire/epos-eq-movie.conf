# PipeWire filter-chain EQ profile: MOVIE (Cinematic Sub-Bass & Dialogue Clarity)
# Deep LFE punch paired with vocal intelligibility in the 1.5kHz-3kHz range.
# Target: EPOS H3PRO Hybrid (alsa_output.usb-1395_EPOS_H3PRO_0123456789ABCDEF-00.iec958-stereo)

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "EPOS H3PRO EQ (Movie)"
            media.name       = "EPOS H3PRO EQ (Movie)"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 50.0 "Q" = 0.707 "Gain" = 4.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 120.0 "Q" = 1.0 "Gain" = 2.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 1500.0 "Q" = 1.2 "Gain" = 2.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 3000.0 "Q" = 1.2 "Gain" = 2.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_highshelf
                        control = { "Freq" = 8500.0 "Q" = 0.707 "Gain" = 1.5 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name      = "epos_h3pro_eq_movie"
                media.class    = Audio/Sink
                audio.rate     = 48000
            }
            playback.props = {
                node.name      = "epos_h3pro_eq_movie_out"
                node.passive   = true
                audio.rate     = 48000
                target.object  = "alsa_output.usb-1395_EPOS_H3PRO_0123456789ABCDEF-00.iec958-stereo"
            }
        }
    }
]
